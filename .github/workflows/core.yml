name: Foundation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-smoke
          path: artifacts/browser/*.png
          if-no-files-found: ignore
