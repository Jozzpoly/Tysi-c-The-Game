name: Run 04 P4B Patch

on:
  push:
    branches:
      - run04/friend-preview-candidate-01

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: run04/friend-preview-candidate-01
          fetch-depth: 0
      - name: Apply bounded P4-B presentation patch
        shell: bash
        run: |
          python scripts/run04-p4b-patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(run04): hand off thrown card to authoritative table target"
          git push origin HEAD:run04/friend-preview-candidate-01
