name: Stable Origin Recheck (NO REDEPLOY)

on:
  workflow_dispatch:
    inputs:
      origin:
        description: "Exact canonical stable workers.dev origin produced by Stable Multiplayer Deploy"
        required: true
        type: string
      expected_sha:
        description: "Exact 40-character product SHA that must still be serving on that origin"
        required: true
        type: string
      confirm_no_redeploy:
        description: "Recheck the existing origin without deploying anything"
        required: true
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - .github/deploy/stable-recheck.json

permissions:
  contents: read

concurrency:
  group: tysiac-stable-origin-recheck
  cancel-in-progress: false

jobs:
  recheck:
    if: ${{ github.event_name == 'push' || inputs.confirm_no_redeploy }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout current validation harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require main validation authority
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Stable-origin recheck validation authority must come from main; got $GITHUB_REF"
            exit 1
          fi
          echo "Validation harness SHA: $GITHUB_SHA"

      - name: Resolve canonical origin and exact product SHA
        id: target
        env:
          MANUAL_ORIGIN: ${{ inputs.origin }}
          MANUAL_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            REQUEST_FILE=.github/deploy/stable-recheck.json
            if [[ ! -f "$REQUEST_FILE" ]]; then
              echo "::error::Declarative recheck trigger fired without $REQUEST_FILE"
              exit 1
            fi
            ORIGIN="$(node -e "const fs=require('fs'); const v=JSON.parse(fs.readFileSync('$REQUEST_FILE','utf8')); process.stdout.write(String(v.origin ?? ''));")"
            EXPECTED_SHA="$(node -e "const fs=require('fs'); const v=JSON.parse(fs.readFileSync('$REQUEST_FILE','utf8')); process.stdout.write(String(v.sha ?? ''));")"
            TRIGGER_SOURCE="declarative-file"
          else
            ORIGIN="$MANUAL_ORIGIN"
            EXPECTED_SHA="$MANUAL_SHA"
            TRIGGER_SOURCE="workflow-dispatch"
          fi

          if [[ ! "$ORIGIN" =~ ^https://tysiac-the-game\.[a-z0-9-]+\.workers\.dev/?$ ]]; then
            echo "::error::origin must be the canonical tysiac-the-game.<account>.workers.dev root produced by Stable Multiplayer Deploy"
            echo "::error::Versioned preview URLs, foreign hosts, paths, query strings and fragments are not valid long-horizon evidence targets."
            exit 1
          fi
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::expected_sha must be a full 40-character lowercase git SHA"
            exit 1
          fi

          echo "origin=$ORIGIN" >> "$GITHUB_OUTPUT"
          echo "sha=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"
          echo "source=$TRIGGER_SOURCE" >> "$GITHUB_OUTPUT"
          echo "Resolved no-redeploy recheck: $ORIGIN @ product $EXPECTED_SHA ($TRIGGER_SOURCE)"

      - name: Verify product candidate commit exists without replacing current harness
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$EXPECTED_SHA"
          git cat-file -e "${EXPECTED_SHA}^{commit}"
          echo "Product candidate exists: $EXPECTED_SHA"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Prove the same stable product build is still serving
        env:
          TYSIAC_PUBLIC_URL: ${{ steps.target.outputs.origin }}
          TYSIAC_EXPECTED_SHA: ${{ steps.target.outputs.sha }}
          TYSIAC_EXPECTED_DEPLOY_CLASS: stable
        run: node scripts/public-provenance-smoke.mjs

      - name: Recheck public multiplayer behavior without redeploying
        env:
          TYSIAC_PUBLIC_URL: ${{ steps.target.outputs.origin }}
        run: node scripts/public-deploy-smoke.mjs

      - name: Recheck the actual copied friend invite without redeploying
        env:
          TYSIAC_PUBLIC_URL: ${{ steps.target.outputs.origin }}
        run: node scripts/public-share-link-smoke.mjs

      - name: Record long-horizon evidence point
        env:
          ORIGIN: ${{ steps.target.outputs.origin }}
          EXPECTED_SHA: ${{ steps.target.outputs.sha }}
          TRIGGER_SOURCE: ${{ steps.target.outputs.source }}
          VALIDATION_HARNESS_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          CHECKED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "### Stable origin recheck — no redeploy" >> "$GITHUB_STEP_SUMMARY"
          echo "Canonical origin: $ORIGIN" >> "$GITHUB_STEP_SUMMARY"
          echo "Expected/served product SHA: $EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Validation harness SHA: $VALIDATION_HARNESS_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Trigger source: $TRIGGER_SOURCE" >> "$GITHUB_STEP_SUMMARY"
          echo "Checked at: $CHECKED_AT" >> "$GITHUB_STEP_SUMMARY"
          echo "**PASS:** the same canonical account-owned stable origin still served the exact product SHA, and current-main public multiplayer + exact copied-invite evidence still worked without redeploying." >> "$GITHUB_STEP_SUMMARY"
          echo "This is elapsed-time evidence. It still does not replace the required real-human Owner+friend test." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: stable-origin-recheck-${{ github.run_id }}
          path: artifacts/browser/public-*.png
          if-no-files-found: ignore
