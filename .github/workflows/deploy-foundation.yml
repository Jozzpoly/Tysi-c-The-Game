name: Stable Multiplayer Deploy

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact 40-character Git SHA to deploy. This is the build that will be provenance-checked publicly."
        required: true
        type: string
      confirm:
        description: "Publish exactly candidate_sha to the account-owned non-temporary Cloudflare Worker"
        required: true
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - .github/deploy/stable-candidate.txt
      - .github/deploy/stable-deploy-request.txt

permissions:
  contents: read

concurrency:
  group: tysiac-stable-multiplayer-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'push' || inputs.confirm }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout deployment request source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require main validation authority
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Stable deployment validation authority must come from main; got $GITHUB_REF"
            exit 1
          fi
          echo "Validation harness SHA: $GITHUB_SHA"

      - name: Resolve exact candidate SHA
        id: candidate
        env:
          MANUAL_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if [[ ! -f .github/deploy/stable-candidate.txt ]]; then
              echo "::error::Declarative stable deploy trigger fired without .github/deploy/stable-candidate.txt"
              exit 1
            fi
            CANDIDATE_SHA="$(tr -d '[:space:]' < .github/deploy/stable-candidate.txt)"
            TRIGGER_SOURCE="declarative-file"
          else
            CANDIDATE_SHA="$MANUAL_SHA"
            TRIGGER_SOURCE="workflow-dispatch"
          fi

          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Stable candidate must be a full 40-character lowercase git SHA; got: $CANDIDATE_SHA"
            exit 1
          fi

          echo "sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          echo "source=$TRIGGER_SOURCE" >> "$GITHUB_OUTPUT"
          echo "Resolved stable candidate: $CANDIDATE_SHA ($TRIGGER_SOURCE)"

      - name: Checkout exact candidate commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.candidate.outputs.sha }}

      - name: Verify checkout identity
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [[ "$ACTUAL_SHA" != "$CANDIDATE_SHA" ]]; then
            echo "::error::Checked out $ACTUAL_SHA but resolved candidate is $CANDIDATE_SHA"
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Normalize and verify permanent Cloudflare credentials
        env:
          CLOUDFLARE_ACCOUNT_ID_RAW: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID_RAW" ]]; then
            echo "::error::Missing repository secret CLOUDFLARE_ACCOUNT_ID. Stable/shareable multiplayer deploy requires an owned Cloudflare account."
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_API_TOKEN_RAW" ]]; then
            echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN. Stable/shareable multiplayer deploy requires an owned Cloudflare account."
            exit 1
          fi

          ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID_RAW" | tr -d '[:space:]')"
          TOKEN="$(python3 - <<'PY'
          import os
          import re

          value = os.environ['CLOUDFLARE_API_TOKEN_RAW'].strip()

          def unwrap(text: str) -> str:
              text = text.strip()
              if len(text) >= 2 and text[0] == text[-1] and text[0] in {'\"', "'"}:
                  return text[1:-1].strip()
              return text

          value = unwrap(value)
          if value.startswith('CLOUDFLARE_API_TOKEN='):
              value = unwrap(value.split('=', 1)[1])
          value = re.sub(r'^Authorization\s*:\s*Bearer\s+', '', value, flags=re.IGNORECASE)
          value = re.sub(r'^Bearer\s+', '', value, flags=re.IGNORECASE)
          value = unwrap(value)
          value = ''.join(value.split())
          print(value, end='')
          PY
          )"

          if [[ ! "$ACCOUNT_ID" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not a 32-character Cloudflare account ID after whitespace normalization."
            exit 1
          fi
          if [[ -z "$TOKEN" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN is empty after safe normalization."
            exit 1
          fi
          if [[ "$TOKEN" == "$ACCOUNT_ID" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN equals CLOUDFLARE_ACCOUNT_ID; the token secret was not stored in the token secret."
            exit 1
          fi

          echo "::add-mask::$TOKEN"
          if [[ "$TOKEN" == cfat_* ]]; then
            TOKEN_FORMAT="account-token"
          elif [[ "$TOKEN" == cfut_* ]]; then
            TOKEN_FORMAT="user-token"
          else
            TOKEN_FORMAT="legacy-or-unrecognized"
          fi
          if [[ "$TOKEN" == "$CLOUDFLARE_API_TOKEN_RAW" ]]; then
            NORMALIZED="no"
          else
            NORMALIZED="yes"
          fi
          echo "Cloudflare credential shape: token_format=$TOKEN_FORMAT normalized=$NORMALIZED"

          VERIFY_FILE="$RUNNER_TEMP/cloudflare-account-token-verify.json"
          HTTP_CODE="$(curl --silent --show-error --output "$VERIFY_FILE" --write-out '%{http_code}' \
            --header "Authorization: Bearer $TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/tokens/verify" || true)"

          node - "$VERIFY_FILE" "$HTTP_CODE" <<'NODE'
          const fs = require('node:fs');
          const [file, httpCode] = process.argv.slice(2);
          let payload = null;
          try {
            payload = JSON.parse(fs.readFileSync(file, 'utf8'));
          } catch {
            console.error(`::error::Cloudflare account-token preflight returned an unreadable response (HTTP ${httpCode || 'network-error'}).`);
            process.exit(1);
          }
          const codes = Array.isArray(payload.errors)
            ? payload.errors.map((entry) => entry?.code).filter((value) => value != null).join(',')
            : '';
          const status = payload?.result?.status ?? 'unknown';
          if (payload?.success !== true || status !== 'active') {
            console.error(`::error::Cloudflare account-token preflight failed (HTTP ${httpCode || 'network-error'}; status=${status}; error_codes=${codes || 'none'}).`);
            process.exit(1);
          }
          console.log('Cloudflare account-token preflight: PASS (active).');
          NODE

          printf 'CLOUDFLARE_ACCOUNT_ID=%s\n' "$ACCOUNT_ID" >> "$GITHUB_ENV"
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$TOKEN" >> "$GITHUB_ENV"
          printf 'INPUT_ACCOUNTID=%s\n' "$ACCOUNT_ID" >> "$GITHUB_ENV"
          printf 'INPUT_APITOKEN=%s\n' "$TOKEN" >> "$GITHUB_ENV"

      - name: Run complete Foundation and deployment-contract gates on exact candidate
        run: npm run check

      - name: Deploy exact candidate to account-owned non-temporary Worker
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          wranglerVersion: "4.131.1"
          packageManager: npm
          command: deploy --var TYSIAC_BUILD_SHA:${{ steps.candidate.outputs.sha }} --var TYSIAC_DEPLOY_CLASS:stable

      - name: Verify deployment is registered in the owned Cloudflare account
        run: npx --no-install wrangler deployments list

      - name: Require the canonical account-owned workers.dev origin
        env:
          PUBLIC_URL: ${{ steps.deploy.outputs.deployment-url }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          TRIGGER_SOURCE: ${{ steps.candidate.outputs.source }}
          VALIDATION_HARNESS_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$PUBLIC_URL" ]]; then
            echo "::error::Cloudflare deployment completed without a deployment-url output; public verification cannot proceed."
            exit 1
          fi
          if [[ ! "$PUBLIC_URL" =~ ^https://tysiac-the-game\.[a-z0-9-]+\.workers\.dev/?$ ]]; then
            echo "::error::Expected canonical account-owned workers.dev root for tysiac-the-game, got: $PUBLIC_URL"
            echo "::error::Versioned preview URLs, foreign hosts, paths, query strings and fragments are not accepted as the friend origin."
            exit 1
          fi
          echo "### Account-owned non-temporary multiplayer origin" >> "$GITHUB_STEP_SUMMARY"
          echo "$PUBLIC_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Product candidate SHA: $CANDIDATE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Validation harness SHA: $VALIDATION_HARNESS_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Trigger source: $TRIGGER_SOURCE" >> "$GITHUB_STEP_SUMMARY"
          echo "Mechanism evidence: exact candidate checkout + authenticated normal 'wrangler deploy' + owned-account deployment registration + canonical workers.dev target." >> "$GITHUB_STEP_SUMMARY"
          echo "This does NOT by itself certify long-horizon availability or real-human friend readiness." >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout current validation harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: .validation-harness

      - name: Install current validation harness dependencies
        working-directory: .validation-harness
        run: npm ci --no-audit --no-fund

      - name: Verify exact public build provenance
        working-directory: .validation-harness
        env:
          TYSIAC_PUBLIC_URL: ${{ steps.deploy.outputs.deployment-url }}
          TYSIAC_EXPECTED_SHA: ${{ steps.candidate.outputs.sha }}
          TYSIAC_EXPECTED_DEPLOY_CLASS: stable
        run: node scripts/public-provenance-smoke.mjs

      - name: Public multiplayer behavior — pass 1
        working-directory: .validation-harness
        env:
          TYSIAC_PUBLIC_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: node scripts/public-deploy-smoke.mjs

      - name: Verify the actual in-game copied friend invite
        working-directory: .validation-harness
        env:
          TYSIAC_PUBLIC_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: node scripts/public-share-link-smoke.mjs

      - name: Short-window repeatability — pass 2
        working-directory: .validation-harness
        env:
          TYSIAC_PUBLIC_URL: ${{ steps.deploy.outputs.deployment-url }}
          TYSIAC_EXPECTED_SHA: ${{ steps.candidate.outputs.sha }}
          TYSIAC_EXPECTED_DEPLOY_CLASS: stable
        shell: bash
        run: |
          set -euo pipefail
          sleep 60
          node scripts/public-provenance-smoke.mjs
          node scripts/public-deploy-smoke.mjs
          node scripts/public-share-link-smoke.mjs

      - name: Record exact evidence boundary
        env:
          PUBLIC_URL: ${{ steps.deploy.outputs.deployment-url }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          TRIGGER_SOURCE: ${{ steps.candidate.outputs.source }}
          VALIDATION_HARNESS_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**PASS — product candidate identity:** exact commit $CANDIDATE_SHA was resolved from $TRIGGER_SOURCE, checked out and deployed." >> "$GITHUB_STEP_SUMMARY"
          echo "**PASS — validation authority:** public evidence was produced by current main harness $VALIDATION_HARNESS_SHA, independently of the frozen product commit." >> "$GITHUB_STEP_SUMMARY"
          echo "**PASS — deployment mechanism:** authenticated account-owned normal deploy; not an unclaimed temporary account." >> "$GITHUB_STEP_SUMMARY"
          echo "**PASS — canonical origin:** deployment target is the root tysiac-the-game.<account>.workers.dev origin, not a versioned preview URL." >> "$GITHUB_STEP_SUMMARY"
          echo "**PASS — provenance:** public runtime reports exact candidate SHA $CANDIDATE_SHA and deploy class stable." >> "$GITHUB_STEP_SUMMARY"
          echo "**PASS — public runtime, repeated:** health, built SPA, duo desktop↔mobile sync, hidden-hand separation, command propagation, refresh/reconnect." >> "$GITHUB_STEP_SUMMARY"
          echo "**PASS — copied invite:** the exact URL produced by 'Kopiuj link dla znajomego' is HTTPS, same-origin, room-only, credential-free, and joins a second client." >> "$GITHUB_STEP_SUMMARY"
          echo "**NOT YET PROVEN BY THIS RUN:** long-horizon availability and the required real-human Owner+friend session." >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate stable origin: $PUBLIC_URL" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: stable-public-evidence-${{ github.run_id }}
          path: .validation-harness/artifacts/browser/public-*.png
          if-no-files-found: ignore
