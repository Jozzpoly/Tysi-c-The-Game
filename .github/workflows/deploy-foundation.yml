name: Stable Multiplayer Deploy

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact 40-character Git SHA to deploy. This is the build that will be provenance-checked publicly."
        required: true
        type: string
      confirm:
        description: "Publish exactly candidate_sha to the account-owned non-temporary Cloudflare Worker"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tysiac-stable-multiplayer-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Validate exact candidate SHA
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::candidate_sha must be a full 40-character lowercase git SHA"
            exit 1
          fi

      - name: Checkout exact candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}

      - name: Verify checkout identity
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [[ "$ACTUAL_SHA" != "$CANDIDATE_SHA" ]]; then
            echo "::error::Checked out $ACTUAL_SHA but candidate_sha is $CANDIDATE_SHA"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Verify permanent deployment credentials are configured
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Missing repository secret CLOUDFLARE_ACCOUNT_ID. Stable/shareable multiplayer deploy requires an owned Cloudflare account."
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN. Stable/shareable multiplayer deploy requires an owned Cloudflare account."
            exit 1
          fi

      - name: Run complete Foundation and deployment-contract gates on exact candidate
        run: npm run check

      - name: Deploy exact candidate to account-owned non-temporary Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.131.1"
          packageManager: npm
          command: deploy --var TYSIAC_BUILD_SHA:${{ inputs.candidate_sha }} --var TYSIAC_DEPLOY_CLASS:stable

      - name: Verify deployment is registered in the owned Cloudflare account
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deployments list

      - name: Require the canonical account-owned workers.dev origin
        env:
          PUBLIC_URL: ${{ steps.deploy.outputs.deployment-url }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$PUBLIC_URL" ]]; then
            echo "::error::Cloudflare deployment completed without a deployment-url output; public verification cannot proceed."
            exit 1
          fi
          if [[ ! "$PUBLIC_URL" =~ ^https://tysiac-the-game\.[a-z0-9-]+\.workers\.dev/?$ ]]; then
            echo "::error::Expected canonical account-owned workers.dev root for tysiac-the-game, got: $PUBLIC_URL"
            echo "::error::Versioned preview URLs, foreign hosts, paths, query strings and fragments are not accepted as the friend origin."
            exit 1
          fi
          echo "### Account-owned non-temporary multiplayer origin" >> "$GITHUB_STEP_SUMMARY"
          echo "$PUBLIC_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate SHA: $CANDIDATE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Workflow-definition SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Mechanism evidence: exact candidate checkout + authenticated normal 'wrangler deploy' + owned-account deployment registration + canonical workers.dev target." >> "$GITHUB_STEP_SUMMARY"
          echo "This does NOT by itself certify long-horizon availability or real-human friend readiness." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify exact public build provenance
        env:
          TYSIAC_PUBLIC_URL: ${{ steps.deploy.outputs.deployment-url }}
          TYSIAC_EXPECTED_SHA: ${{ inputs.candidate_sha }}
          TYSIAC_EXPECTED_DEPLOY_CLASS: stable
        run: node scripts/public-provenance-smoke.mjs

      - name: Public multiplayer behavior — pass 1
        env:
          TYSIAC_PUBLIC_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: node scripts/public-deploy-smoke.mjs

      - name: Verify the actual in-game copied friend invite
        env:
          TYSIAC_PUBLIC_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: node scripts/public-share-link-smoke.mjs

      - name: Short-window repeatability — pass 2
        env:
          TYSIAC_PUBLIC_URL: ${{ steps.deploy.outputs.deployment-url }}
          TYSIAC_EXPECTED_SHA: ${{ inputs.candidate_sha }}
          TYSIAC_EXPECTED_DEPLOY_CLASS: stable
        shell: bash
        run: |
          set -euo pipefail
          sleep 60
          node scripts/public-provenance-smoke.mjs
          node scripts/public-deploy-smoke.mjs
          node scripts/public-share-link-smoke.mjs

      - name: Record exact evidence boundary
        env:
          PUBLIC_URL: ${{ steps.deploy.outputs.deployment-url }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**PASS — candidate identity:** exact commit $CANDIDATE_SHA was checked out and deployed." >> "$GITHUB_STEP_SUMMARY"
          echo "**PASS — deployment mechanism:** authenticated account-owned normal deploy; not an unclaimed temporary account." >> "$GITHUB_STEP_SUMMARY"
          echo "**PASS — canonical origin:** deployment target is the root tysiac-the-game.<account>.workers.dev origin, not a versioned preview URL." >> "$GITHUB_STEP_SUMMARY"
          echo "**PASS — provenance:** public runtime reports exact candidate SHA $CANDIDATE_SHA and deploy class stable." >> "$GITHUB_STEP_SUMMARY"
          echo "**PASS — public runtime, repeated:** health, built SPA, duo desktop↔mobile sync, hidden-hand separation, command propagation, refresh/reconnect." >> "$GITHUB_STEP_SUMMARY"
          echo "**PASS — copied invite:** the exact URL produced by 'Kopiuj link dla znajomego' is HTTPS, same-origin, room-only, credential-free, and joins a second client." >> "$GITHUB_STEP_SUMMARY"
          echo "**NOT YET PROVEN BY THIS RUN:** long-horizon availability and the required real-human Owner+friend session." >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate stable origin: $PUBLIC_URL" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stable-public-evidence-${{ github.run_id }}
          path: artifacts/browser/public-*.png
          if-no-files-found: ignore
