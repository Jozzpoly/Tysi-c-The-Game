name: Stable Owner Cloudflare Preview

on:
  push:
    branches:
      - run-02-tactile-interaction-system-02
    paths:
      - '.github/workflows/stable-owner-cloudflare-preview.yml'

permissions:
  contents: read

concurrency:
  group: tysiac-stable-owner-cloudflare-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Require permanent Cloudflare credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Missing CLOUDFLARE_API_TOKEN'; exit 1; }
      - name: Run complete gate
        run: npm run check
      - name: Deploy stable isolated preview
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.131.1'
          packageManager: npm
          command: deploy --name tysiac-the-game-preview
      - name: Verify clean public preview
        env:
          TYSIAC_PUBLIC_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: node scripts/public-deploy-smoke.mjs
      - name: Record URL
        env:
          PUBLIC_URL: ${{ steps.deploy.outputs.deployment-url }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PUBLIC_URL"
          echo "Stable owner preview: $PUBLIC_URL" >> "$GITHUB_STEP_SUMMARY"
