name: Legacy Static Preview (SOLO ONLY)

# This workflow publishes only the static client. It does NOT deploy the
# Cloudflare Worker/Durable Object backend and therefore is NOT a multiplayer
# friend-link path. Keep it only as historical/static-preview infrastructure.
on:
  push:
    branches:
      - run04/friend-preview-candidate-01

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tysiac-legacy-static-preview-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build static client only (no multiplayer backend)
        run: |
          npm run typegen
          npx tsc -p tsconfig.app.json
          npx tsc -p tsconfig.worker.json
          npx vite build --base=/Tysi-c-The-Game/
      - name: Inspect client output
        run: test -f dist/client/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy legacy static preview (SOLO ONLY)
        id: deployment
        uses: actions/deploy-pages@v4
