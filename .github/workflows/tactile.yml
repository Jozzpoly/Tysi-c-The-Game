name: Tactile Slice

on:
  pull_request:
    paths:
      - 'src/presentation/TactileHand.tsx'
      - 'src/presentation/tactileInteraction.ts'
      - 'src/presentation/tactileHandLayout.ts'
      - 'src/tactile-*.css'
      - 'scripts/*hand-browser-smoke.mjs'
      - 'scripts/living-hand-browser-smoke.mjs'
      - 'scripts/mobile-touch-browser-smoke.mjs'
      - 'test/tactile-*.test.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/tactile.yml'

permissions:
  contents: read

jobs:
  tactile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run fast tactile gate
        run: npm run check:tactile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tactile-smoke
          path: |
            artifacts/browser/*tactile*.png
            artifacts/browser/*living-hand*.png
            artifacts/browser/mobile-touch-*.png
          if-no-files-found: ignore