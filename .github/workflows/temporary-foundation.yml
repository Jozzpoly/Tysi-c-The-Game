name: Temporary Preview (EXPIRES — DO NOT SHARE)

on:
  workflow_dispatch:
    inputs:
      accept_cloudflare_terms:
        description: "I accept Cloudflare Terms of Service and Privacy Policy for this temporary deployment"
        required: true
        type: boolean
        default: false
      confirm_public_preview:
        description: "Create an unclaimed EXPIRING workers.dev preview. Do NOT use this as the friend/share link."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tysiac-foundation-temporary-preview
  cancel-in-progress: false

jobs:
  preview:
    if: ${{ inputs.accept_cloudflare_terms && inputs.confirm_public_preview }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Run complete Foundation gate before temporary publishing
        run: npm run check

      - name: Deploy unclaimed temporary Cloudflare preview
        id: temporary
        run: node scripts/temporary-deploy.mjs

      - name: Verify public desktop/mobile MatchRoom behavior
        env:
          TYSIAC_PUBLIC_URL: ${{ steps.temporary.outputs.deployment_url }}
        run: node scripts/public-deploy-smoke.mjs

      - name: Record verified temporary preview
        env:
          PUBLIC_URL: ${{ steps.temporary.outputs.deployment_url }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$PUBLIC_URL" ]]; then
            echo "::error::Temporary deployment completed without a public workers.dev URL."
            exit 1
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**PASS:** public health, duo desktop↔mobile command sync, hidden-hand separation, and refresh/reconnect." >> "$GITHUB_STEP_SUMMARY"
          echo "Verified TEMPORARY URL: $PUBLIC_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "⚠️ This URL is intentionally unclaimed and should expire automatically." >> "$GITHUB_STEP_SUMMARY"
          echo "⚠️ DO NOT send this URL to a friend as a durable/shareable multiplayer link." >> "$GITHUB_STEP_SUMMARY"
          echo "Use the Stable Multiplayer Deploy workflow for friend/Owner links that must remain available." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: temporary-public-smoke-${{ github.run_id }}
          path: artifacts/browser/public-deploy-*.png
          if-no-files-found: ignore
