name: Temporary Preview (EXPIRES — DO NOT SHARE)

on:
  workflow_dispatch:
    inputs:
      accept_cloudflare_terms:
        description: "I accept Cloudflare Terms of Service and Privacy Policy for this temporary deployment"
        required: true
        type: boolean
        default: false
      confirm_public_preview:
        description: "Create an unclaimed EXPIRING workers.dev preview. Do NOT use this as the friend/share link."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tysiac-foundation-temporary-preview
  cancel-in-progress: false

jobs:
  preview:
    if: ${{ inputs.accept_cloudflare_terms && inputs.confirm_public_preview }}
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Run complete Foundation gate before temporary publishing
        run: npm run check

      - name: Deploy unclaimed temporary Cloudflare preview
        id: temporary
        run: node scripts/temporary-deploy.mjs

      - name: Verify exact temporary build provenance
        env:
          TYSIAC_PUBLIC_URL: ${{ steps.temporary.outputs.deployment_url }}
          TYSIAC_EXPECTED_SHA: ${{ github.sha }}
          TYSIAC_EXPECTED_DEPLOY_CLASS: temporary
        run: node scripts/public-provenance-smoke.mjs

      - name: Verify bounded public desktop/mobile MatchRoom behavior
        env:
          TYSIAC_PUBLIC_URL: ${{ steps.temporary.outputs.deployment_url }}
        run: node scripts/public-deploy-smoke.mjs

      - name: Verify copied invite behavior on this temporary runtime
        env:
          TYSIAC_PUBLIC_URL: ${{ steps.temporary.outputs.deployment_url }}
        run: node scripts/public-share-link-smoke.mjs

      - name: Record exact temporary evidence boundary
        env:
          PUBLIC_URL: ${{ steps.temporary.outputs.deployment_url }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$PUBLIC_URL" ]]; then
            echo "::error::Temporary deployment completed without a public workers.dev URL."
            exit 1
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**PASS — provenance:** public runtime reports exact SHA $GITHUB_SHA and deploy class temporary." >> "$GITHUB_STEP_SUMMARY"
          echo "**PASS — bounded runtime only:** public health, duo desktop↔mobile sync, hidden-hand separation, reconnect, and copied-invite behavior worked during this run." >> "$GITHUB_STEP_SUMMARY"
          echo "Verified TEMPORARY URL: $PUBLIC_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "**FAIL as persistence evidence:** this URL is intentionally unclaimed and should expire automatically." >> "$GITHUB_STEP_SUMMARY"
          echo "**DO NOT SHARE AS THE FRIEND CANDIDATE:** a green temporary run cannot satisfy the stable-link gate." >> "$GITHUB_STEP_SUMMARY"
          echo "Use Stable Multiplayer Deploy for the account-owned candidate origin." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: temporary-public-evidence-${{ github.run_id }}
          path: artifacts/browser/public-*.png
          if-no-files-found: ignore
