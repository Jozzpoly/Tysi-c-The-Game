name: Stable Static Owner Preview

on:
  push:
    branches:
      - run-02-tactile-interaction-system-02
    paths-ignore:
      - 'static-preview/**'

permissions:
  contents: write

concurrency:
  group: tysiac-stable-static-owner-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: run-02-tactile-interaction-system-02
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build standalone local-game preview
        run: |
          npx vite build --config vite.static-preview.config.ts
          mv static-preview/index.html static-preview/app.html
          cat > static-preview/index.html <<'EOF'
          <!doctype html>
          <html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Tysiąc The Game</title><script>location.replace('./app.html?local=1')</script></head><body><a href="./app.html?local=1">Otwórz Tysiąc The Game</a></body></html>
          EOF
      - name: Commit immutable static build inputs to preview branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f static-preview
          if ! git diff --cached --quiet; then
            git commit -m "preview: build standalone solo demo"
            git push origin HEAD:run-02-tactile-interaction-system-02
          else
            echo "Static preview already current."
          fi
      - name: Verify permanent CDN snapshot
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          BASE="https://rawcdn.githack.com/Jozzpoly/Tysi-c-The-Game/${SHA}/static-preview"
          ok=0
          for attempt in {1..12}; do
            if curl -fsSL "$BASE/index.html" -o /tmp/index.html && curl -fsSL "$BASE/app.html" -o /tmp/app.html; then
              ok=1
              break
            fi
            sleep 5
          done
          if [[ "$ok" != "1" ]]; then
            echo "::error::Permanent CDN snapshot did not become reachable."
            exit 1
          fi
          grep -q "Tysiąc The Game" /tmp/index.html
          grep -q "Tysiąc The Game" /tmp/app.html
          JS="$(grep -o 'src="\./assets/[^"]*"' /tmp/app.html | head -n1 | cut -d'"' -f2)"
          CSS="$(grep -o 'href="\./assets/[^"]*"' /tmp/app.html | head -n1 | cut -d'"' -f2)"
          test -n "$JS"
          test -n "$CSS"
          curl -fsSL "$BASE/${JS#./}" -o /tmp/app.js
          curl -fsSL "$BASE/${CSS#./}" -o /tmp/app.css
          test -s /tmp/app.js
          test -s /tmp/app.css
          echo "### Stable standalone solo preview" >> "$GITHUB_STEP_SUMMARY"
          echo "$BASE/index.html" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit-pinned CDN snapshot; no Cloudflare temporary-worker expiry." >> "$GITHUB_STEP_SUMMARY"
